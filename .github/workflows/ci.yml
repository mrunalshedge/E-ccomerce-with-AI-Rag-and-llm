name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: shopsense
          POSTGRES_PASSWORD: shopsense
          POSTGRES_DB: shopsense_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shopsense -d shopsense_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Throwaway CI-only values; tests never call real AI (fake embeddings, scripted models).
      POSTGRES_USER: shopsense
      POSTGRES_PASSWORD: shopsense
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: shopsense
      POSTGRES_TEST_DB: shopsense_test
      JWT_SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Migrations apply cleanly and match the models
        run: |
          alembic -x db=test upgrade head
          alembic -x db=test check
      - run: pytest -q

  frontend:
    name: Frontend typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
